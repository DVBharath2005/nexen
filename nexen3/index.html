<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>NEXEN - The Tech Professional Network</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        scrollbar-gutter: stable;
      }
      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif,
          "Apple Color Emoji",
          "Segoe UI Emoji",
          "Segoe UI Symbol";
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: hsl(var(--color-slate-50));
        color: hsl(var(--color-slate-900));
        transition: background-color 0.3s, color 0.3s;
      }
      [data-theme="dark"] body {
        background-color: hsl(var(--color-slate-950));
        color: hsl(var(--color-slate-white));
      }
      /* Custom scrollbar for a cleaner look, especially on Windows */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background-color: hsl(var(--color-slate-300 / 0.5));
        border-radius: 9999px;
        border: 2px solid transparent;
        background-clip: padding-box;
        transition: background-color 0.2s;
      }
      [data-theme="dark"] ::-webkit-scrollbar-thumb {
        background-color: hsl(var(--color-slate-800 / 0.5));
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: hsl(var(--color-slate-400));
      }
      [data-theme="dark"] ::-webkit-scrollbar-thumb:hover {
        background-color: hsl(var(--color-slate-700));
      }
      /* Firefox support */
      * {
        scrollbar-width: thin;
        scrollbar-color: hsl(var(--color-slate-300)) transparent;
      }
      [data-theme="dark"] * {
        scrollbar-color: hsl(var(--color-slate-800)) transparent;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react/": "https://esm.sh/react@^19.2.3/",
          "react": "https://esm.sh/react@^19.2.3",
          "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
          "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
          "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
        }
      }
    </script>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
